server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=1

        - id: todo-service
          uri: ${TODO_SERVICE_URL}
          predicates:
            - Path=/api/v1/todos/**
          filters:
            - StripPrefix=0

    loadbalancer:
      retry:
        enabled: false

jwt:
  secret: ${JWT_SECRET}
  header: Authorization
  prefix: Bearer


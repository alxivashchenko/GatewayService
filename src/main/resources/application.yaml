#          allowedHeaders:
#            - "*"
#          allowCredentials: true


    loadbalancer:
      retry:
        enabled:  false

jwt:
  secret: ${JWT_SECRET}
  header: Authorization
  prefix: Bearer

app:
  cors:
    allowed-origins:
      - ${FRONTEND_URL}
      - ${FRONTEND_URL_SERVER}


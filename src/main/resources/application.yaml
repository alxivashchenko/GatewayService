server:
  port: ${SERVER_PORT}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**
          filters:
              - StripPrefix=0

        - id: todo-service
          uri: ${TODO_SERVICE_URL}
          predicates:
            - Path=/api/v1/todos/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
#    globalcors:

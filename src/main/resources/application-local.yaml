server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=1

        - id: todo-service
          uri: http://localhost:8082
#          uri: http://todo-service:8082
          predicates:
            - Path=/api/v1/todos/**
          filters:
            - StripPrefix=0

    loadbalancer:
      retry:
        enabled: false

jwt:
  secret: my-super-secret-test-long-256-bit-key-for-todo-project
  header: Authorization
  prefix: Bearer
